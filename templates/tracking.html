{% extends "base.html" %}
{% block title %}Bus Tracking - Smart SMS{% endblock %}

{% block extra_head %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3 mb-0">Live bus tracking</h1>
  <span class="text-muted small" id="last-updated"></span>
</div>

<div class="row g-3">
  <div class="col-lg-8">
    <div class="card stat-card p-0 overflow-hidden">
      <div id="map" style="height: 480px;"></div>
    </div>
  </div>
  <div class="col-lg-4">
    <div class="card stat-card">
      <div class="table-wrap">
        <table class="table table-sm mb-0">
          <thead class="table-light">
            <tr><th>Bus</th><th>Route</th><th>Speed</th></tr>
          </thead>
          <tbody id="bus-rows">
            <tr><td colspan="3" class="text-muted">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // OpenStreetMap, the free option named in the document's technology stack -
  // no API key needed, unlike Google Maps.
  const map = L.map("map").setView([12.9716, 77.5946], 12);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "&copy; OpenStreetMap contributors",
    maxZoom: 19,
  }).addTo(map);

  const markers = {};

  async function refresh() {
    const buses = await API.getJSON("/api/transport/tracking/");
    if (!buses) return;

    const body = document.getElementById("bus-rows");
    body.innerHTML = buses.length
      ? buses.map(function (b) {
          return "<tr><td>" + b.registration_number + "</td><td>" +
            (b.route || "-") + "</td><td>" +
            (b.speed_kmph !== null ? b.speed_kmph + " km/h" : "-") + "</td></tr>";
        }).join("")
      : '<tr><td colspan="3" class="text-muted">No buses.</td></tr>';

    buses.forEach(function (bus) {
      // A bus that has not reported a position yet has no marker to place.
      if (bus.latitude === null || bus.longitude === null) return;
      const point = [parseFloat(bus.latitude), parseFloat(bus.longitude)];

      if (markers[bus.bus_id]) {
        markers[bus.bus_id].setLatLng(point);
      } else {
        markers[bus.bus_id] = L.marker(point)
          .addTo(map)
          .bindPopup(bus.registration_number + "<br>" + (bus.route || ""));
      }
    });

    document.getElementById("last-updated").textContent =
      "Updated " + new Date().toLocaleTimeString();
  }

  refresh();
  // Polling rather than websockets: drivers push a location every few seconds
  // and a 10s refresh is well inside the useful resolution for a bus.
  setInterval(refresh, 10000);
</script>
{% endblock %}
