{% extends "base.html" %}
{% block title %}Students - Smart SMS{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3 mb-0">Students</h1>
  <input class="form-control w-auto" id="search" placeholder="Filter by name or admission no.">
</div>

<div class="card stat-card">
  <div class="table-wrap">
    <table class="table table-hover mb-0 align-middle">
      <thead class="table-light">
        <tr>
          <th>Admission no.</th>
          <th>Roll no.</th>
          <th>Gender</th>
          <th>Date of birth</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="student-rows">
        <tr><td colspan="5" class="text-muted">Loading...</td></tr>
      </tbody>
    </table>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  let students = [];

  function render(rows) {
    const body = document.getElementById("student-rows");
    if (!rows.length) {
      body.innerHTML = '<tr><td colspan="5" class="text-muted">No students found.</td></tr>';
      return;
    }
    body.innerHTML = rows.map((s) =>
      "<tr>" +
      "<td>" + s.admission_no + "</td>" +
      "<td>" + s.roll_number + "</td>" +
      "<td>" + (s.gender || "-") + "</td>" +
      "<td>" + (s.date_of_birth || "-") + "</td>" +
      "<td>" + (s.is_active
        ? '<span class="badge text-bg-success">Active</span>'
        : '<span class="badge text-bg-secondary">Inactive</span>') + "</td>" +
      "</tr>"
    ).join("");
  }

  document.getElementById("search").addEventListener("input", (event) => {
    const term = event.target.value.toLowerCase();
    render(students.filter((s) =>
      (s.admission_no || "").toLowerCase().includes(term) ||
      (s.roll_number || "").toLowerCase().includes(term)
    ));
  });

  (async function load() {
    const data = await API.getJSON("/api/students/");
    if (!data) {
      showAlert("Could not load students.");
      return;
    }
    students = Array.isArray(data) ? data : (data.results || []);
    render(students);
  })();
</script>
{% endblock %}
