<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in - Smart Student Management System</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #1976D2 0%, #0d47a1 100%);
    }
    .login-card { width: min(400px, 92vw); border: none; border-radius: 1rem; }
  </style>
</head>
<body>

<div class="card login-card shadow-lg p-4">
  <h1 class="h4 text-center mb-1">Smart Student</h1>
  <p class="text-center text-muted small mb-4">Management System</p>

  <div id="login-error" class="alert alert-danger d-none py-2 small"></div>

  <form id="login-form">
    <div class="mb-3">
      <label class="form-label" for="username">Username</label>
      <input class="form-control" id="username" name="username" required autofocus>
    </div>
    <div class="mb-3">
      <label class="form-label" for="password">Password</label>
      <input class="form-control" id="password" name="password" type="password" required>
    </div>
    <button class="btn btn-primary w-100" type="submit" id="submit-btn">Sign in</button>
  </form>
</div>

<script>
  const form = document.getElementById("login-form");
  const errorBox = document.getElementById("login-error");
  const submitBtn = document.getElementById("submit-btn");

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    errorBox.classList.add("d-none");
    submitBtn.disabled = true;
    submitBtn.textContent = "Signing in...";

    try {
      const response = await fetch("/api/accounts/login/", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          username: document.getElementById("username").value,
          password: document.getElementById("password").value,
        }),
      });

      const data = await response.json();

      if (!response.ok) {
        errorBox.textContent = data.error || "Sign in failed.";
        errorBox.classList.remove("d-none");
        return;
      }

      localStorage.setItem("access", data.access);
      localStorage.setItem("refresh", data.refresh);
      localStorage.setItem("user", JSON.stringify(data.user));
      window.location = "/";
    } catch (err) {
      errorBox.textContent = "Could not reach the server.";
      errorBox.classList.remove("d-none");
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Sign in";
    }
  });
</script>
</body>
</html>
