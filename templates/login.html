{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Sign in · Smart Student Management System</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <style>
    body { display: grid; place-items: center; min-height: 100vh; padding: 20px; }
    .login { width: min(400px, 100%); }
    .login__brand { display: flex; align-items: center; justify-content: center;
      gap: 10px; margin-bottom: 20px; font-size: 1.05rem; font-weight: 650; }
    .login__mark { width: 34px; height: 34px; border-radius: 9px; background: var(--brand);
      color: #fff; display: grid; place-items: center; font-weight: 700; font-size: .8rem; }
  </style>
</head>
<body>

<div class="login">
  <div class="login__brand">
    <span class="login__mark" aria-hidden="true">SS</span>
    <span>Smart Student Management</span>
  </div>

  <div class="card">
    <div class="card__body">
      <h1 style="font-size:1.15rem">Sign in</h1>
      <p class="muted small" style="margin:0 0 18px">
        Use the account issued by your school.
      </p>

      <div id="form-error" class="pill pill--danger" role="alert"
           style="display:none;width:100%;border-radius:8px;padding:9px 12px;margin-bottom:14px">
      </div>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="username">Username</label>
          <input class="input" id="username" name="username" autocomplete="username"
                 required autofocus autocapitalize="none" spellcheck="false">
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input class="input" id="password" name="password" type="password"
                 autocomplete="current-password" required>
        </div>

        <button class="btn btn--primary" type="submit" id="submit-btn"
                style="width:100%">Sign in</button>
      </form>
    </div>
  </div>

  <p class="muted small" style="text-align:center;margin-top:14px">
    Trouble signing in? Contact your school office.
  </p>
</div>

<script src="{% static 'js/app.js' %}"></script>
<script>
  const form = document.getElementById("login-form");
  const errorBox = document.getElementById("form-error");
  const submitBtn = document.getElementById("submit-btn");

  // Only same-origin paths are honoured, so a crafted ?next= cannot bounce
  // someone to another site carrying the impression they are still signed in.
  function safeNext() {
    const next = new URLSearchParams(window.location.search).get("next");
    return next && next.startsWith("/") && !next.startsWith("//") ? next : "/";
  }

  if (Session.isSignedIn) window.location = safeNext();

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    errorBox.style.display = "none";

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    if (!username || !password) {
      errorBox.textContent = "Enter your username and password.";
      errorBox.style.display = "block";
      return;
    }

    const original = submitBtn.textContent;
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="spinner"></span> Signing in';

    try {
      const data = await API.post("/api/accounts/login/", { username, password });
      API.setSession(data);
      window.location = safeNext();
    } catch (err) {
      errorBox.textContent = err.status === 401
        ? "That username and password do not match."
        : err.message;   // 429 arrives here with the rate-limit wording
      errorBox.style.display = "block";
      document.getElementById("password").value = "";
      document.getElementById("password").focus();
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = original;
    }
  });
</script>
</body>
</html>
