name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A new push supersedes the run already in flight for the same branch.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-workflow:
    name: Workflow is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse every workflow file
        # A malformed workflow fails the whole run with zero jobs and no
        # readable reason, which is slow and confusing to diagnose. Catch it
        # explicitly instead.
        run: |
          python - <<'CHECK'
          import pathlib, sys, yaml
          bad = False
          for path in sorted(pathlib.Path(".github/workflows").glob("*.yml")):
              try:
                  yaml.safe_load(path.read_text())
                  print("ok:", path)
              except yaml.YAMLError as exc:
                  bad = True
                  message = str(exc).replace("\n", " ")
                  print(f"::error file={path}::{message}")
          sys.exit(1 if bad else 0)
          CHECK

  test-sqlite:
    name: Tests (SQLite)
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: ci-only-not-a-real-key
      DEBUG: "True"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: System checks
        run: python manage.py check

      - name: Migrations are complete
        # Catches a model changed without its migration, which passes locally
        # and then fails on deploy.
        run: python manage.py makemigrations --check --dry-run

      - name: Tests
        run: python manage.py test --verbosity=2

  test-mysql:
    name: Tests (MySQL)
    runs-on: ubuntu-latest

    # MySQL is the documented production database, and it differs from SQLite
    # exactly where this project is busiest: decimal rounding on fee totals,
    # case sensitivity in the student search, and constraint support.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root
          MYSQL_DATABASE: student_management_db
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      SECRET_KEY: ci-only-not-a-real-key
      DEBUG: "True"
      DB_ENGINE: django.db.backends.mysql
      DB_NAME: student_management_db
      DB_USER: root
      DB_PASSWORD: ci_root
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Connection and migrations
        # Split out from the tests so a driver or schema problem is named
        # directly rather than surfacing as an opaque test-runner failure.
        run: |
          python - <<'PROBE'
          import os, django
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings")
          django.setup()
          from django.db import connection
          with connection.cursor() as cursor:
              cursor.execute("SELECT VERSION()")
              print("MySQL server:", cursor.fetchone()[0])
          PROBE
          python manage.py migrate --noinput

      - name: Tests against MySQL
        run: |
          set +e
          python manage.py test --verbosity=2 2>&1 | tee mysql-tests.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "### MySQL test failure" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -c 6000 mysql-tests.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            # Annotations are readable through the API; workflow logs are not.
            # One per failing test, so the names are visible rather than
            # whatever happened to fall inside a truncated tail.
            grep -E '^(FAIL|ERROR): ' mysql-tests.log | while read -r line; do
              echo "::error title=MySQL failure::${line}"
            done
            summary=$(tail -c 900 mysql-tests.log | tr '\n\r' '  ')
            echo "::error title=MySQL tail::${summary}"
          fi
          exit "$status"

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mysql-test-log
          path: mysql-tests.log
          if-no-files-found: ignore

  deployment-checks:
    name: Production checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django deployment checklist
        # DEBUG off so the HTTPS, cookie and HSTS settings are actually
        # exercised - with DEBUG on they are skipped and prove nothing.
        env:
          SECRET_KEY: a-sufficiently-long-random-key-for-the-deployment-checklist
          DEBUG: "False"
          ALLOWED_HOSTS: example.com
        run: python manage.py check --deploy --fail-level WARNING

  docker:
    name: Docker image
    runs-on: ubuntu-latest

    # Set for every step, not just the ones that start the stack. The compose
    # file uses ${SECRET_KEY:?...}, so any compose command fails without it -
    # which is what broke the teardown while the stack itself came up fine.
    env:
      SECRET_KEY: ci-only-not-a-real-key

    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t smart-sms:ci .

      - name: Compose config is valid
        run: docker compose config --quiet

      - name: Stack starts and serves
        run: |
          docker compose up -d db web
          # The entrypoint waits for MySQL, migrates, then starts gunicorn.
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:8000/login/; then
              echo "stack is serving"
              exit 0
            fi
            sleep 5
          done
          echo "stack did not come up"
          docker compose logs
          exit 1

      - name: Tear down
        if: always()
        run: docker compose down -v
